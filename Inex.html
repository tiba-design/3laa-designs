<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="deco">
  <title>3laa Designs — بوابة طلبات تصميم وتنسيق الملازم التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;

      /* 1. Deco core palette adapted to 3laa Designs Black & Gold identity */
      --background: #0b0a08;
      --surface-container-low: #13110e;
      --surface-container: #1b1812;
      --surface-container-high: #262118;

      /* Ink */
      --on-surface: #f4ecda;
      --on-surface-variant: #c9bfa9;

      /* Rules */
      --outline: #c9a14a;
      --outline-variant: #5d4e2b;

      /* Accents */
      --primary: #c9a14a;
      --on-primary: #0b0a08;
      --primary-container: #292213;
      --on-primary-container: #ebd292;
      --secondary: #86bfa5;
      --tertiary: #e0c175;
      --error: #e8836f;
      --on-error: #0b0a08;

      /* Data series */
      --data-1: #c9a14a;
      --data-2: #5fae8c;
      --data-3: #e8836f;
      --data-4: #8aa9d6;
      --data-context: #726a58;

      /* Fonts (Arabic-first RTL stack) */
      --font-headline: 'Cairo', 'Tajawal', sans-serif;
      --font-body: 'Tajawal', 'Cairo', sans-serif;
      --font-label: 'Cairo', 'IBM Plex Mono', monospace;
      --font-mono: 'IBM Plex Mono', monospace;

      /* Shape (Deco architectural crisp corners) */
      --rounded: 0px;
      --rounded-lg: 0px;
      --rounded-full: 0px;

      /* Style effects */
      --gold-rule: 1px solid var(--outline);
      --bronze-rule: 1px solid var(--outline-variant);
      --gold-frame-inset: 6px;
      --pinstripe: repeating-linear-gradient(
        90deg,
        rgba(201, 161, 74, 0.045) 0 1px,
        transparent 1px 32px
      );
      --hero-glow: radial-gradient(
        ellipse at 50% 0%,
        rgba(201, 161, 74, 0.14) 0%,
        rgba(11, 10, 8, 0) 68%
      );
      --surface-tint-gold: rgba(201, 161, 74, 0.08);
      --surface-tint-warning: rgba(226, 180, 90, 0.10);
      --surface-tint-positive: rgba(116, 185, 150, 0.11);
      --surface-tint-error: rgba(232, 131, 111, 0.11);
      --flank-rule-width: 36px;

      /* 3. Shared tokens */
      --positive: #74b996;
      --warning: #e2b45a;
      --focus: #e0c175;

      /* Type scale (Focused Tool) */
      --display-size: clamp(1.75rem, 1.35rem + 1.5vw, 2.45rem);
      --headline-size: clamp(1.25rem, 1.08rem + 0.6vw, 1.55rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.2rem);
      --body-size: clamp(0.95rem, 0.92rem + 0.15vw, 1.02rem);
      --label-size: 0.78rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    /* Base reset */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--background);
      background-image: var(--hero-glow), var(--pinstripe);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.65;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: static !important;
    }

    button, input, select, textarea {
      font-family: inherit;
      letter-spacing: 0;
      text-transform: none;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-xl);
      padding: var(--space-lg);
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
    }

    .page-grid * {
      min-width: 0;
    }

    /* Header / Brand Hero */
    .brand-header {
      border: var(--gold-rule);
      outline: var(--gold-rule);
      outline-offset: calc(-1 * var(--gold-frame-inset));
      background-color: var(--surface-container-low);
      padding: var(--space-xl) var(--space-lg);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      animation: fadeUp var(--dur-long) var(--ease-out) both;
    }

    .logo-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
    }

    .brand-emblem {
      width: 96px;
      height: 96px;
      display: block;
    }

    .brand-name {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: clamp(1.35rem, 1.15rem + 0.8vw, 1.85rem);
      color: var(--primary);
      margin: 0;
      letter-spacing: 0.08em;
    }

    .flanked-kicker {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: var(--label-size);
      color: var(--tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin: 0;
    }

    .flanked-kicker::before,
    .flanked-kicker::after {
      content: "";
      display: inline-block;
      width: var(--flank-rule-width);
      height: 1px;
      background: var(--outline);
    }

    .hero-title {
      font-family: var(--font-headline);
      font-weight: 300;
      font-size: var(--display-size);
      line-height: 1.25;
      color: var(--on-surface);
      margin: 0;
    }

    .hero-title b {
      font-weight: 800;
      color: var(--primary);
    }

    .hero-subtitle {
      margin: 0;
      max-width: 58ch;
      color: var(--on-surface-variant);
      font-size: var(--subhead-size);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-sm);
      margin-top: var(--space-xs);
    }

    .nav-jump {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      text-decoration: none;
      font-family: var(--font-label);
      font-weight: 700;
      font-size: 0.9rem;
      border: var(--gold-rule);
      transition: background-color var(--dur-short) var(--ease-out),
                  color var(--dur-short) var(--ease-out);
    }

    .nav-jump--primary {
      background-color: var(--primary);
      color: var(--on-primary);
    }

    .nav-jump--primary:hover {
      background-color: var(--tertiary);
    }

    .nav-jump--ghost {
      background-color: transparent;
      color: var(--primary);
    }

    .nav-jump--ghost:hover {
      background-color: var(--surface-tint-gold);
    }

    .contact-strip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: var(--bronze-rule);
      font-size: 0.9rem;
      color: var(--on-surface-variant);
    }

    .contact-strip strong {
      color: var(--tertiary);
      font-family: var(--font-mono);
    }

    /* Section Headings */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      animation: fadeUp var(--dur-long) var(--ease-out) both;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-md);
      padding-bottom: var(--space-md);
      border-bottom: var(--gold-rule);
    }

    .section-title-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .section-kicker {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: var(--label-size);
      color: var(--primary);
    }

    .section-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--headline-size);
      line-height: 1.3;
      margin: 0;
      color: var(--on-surface);
    }

    .section-lede {
      margin: 0;
      color: var(--on-surface-variant);
      max-width: 65ch;
    }

    .readiness-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border: var(--gold-rule);
      background-color: var(--surface-container-low);
      font-family: var(--font-label);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--tertiary);
      white-space: nowrap;
    }

    .readiness-pill.is-complete {
      border-color: var(--positive);
      background-color: var(--surface-tint-positive);
      color: var(--positive);
    }

    /* Section 1: Preparation Grid */
    .prep-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md);
    }

    .prep-card-wrap {
      container-type: inline-size;
    }

    .prep-card {
      height: 100%;
      background-color: var(--surface-container-low);
      border: var(--bronze-rule);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      transition: background-color var(--dur-short) var(--ease-out),
                  border-color var(--dur-short) var(--ease-out);
    }

    .prep-card.is-checked {
      background-color: var(--surface-container);
      border-color: var(--outline);
    }

    .prep-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: var(--bronze-rule);
    }

    .prep-card-title-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .prep-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: var(--gold-rule);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--primary);
      background-color: var(--primary-container);
    }

    .prep-card-title {
      margin: 0;
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--subhead-size);
      color: var(--on-surface);
    }

    .prep-check-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      min-width: 108px;
      padding: var(--space-xs) var(--space-sm);
      border: var(--bronze-rule);
      background-color: transparent;
      color: var(--on-surface-variant);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color var(--dur-short) var(--ease-out),
                  color var(--dur-short) var(--ease-out),
                  border-color var(--dur-short) var(--ease-out);
    }

    .prep-check-btn:hover {
      border-color: var(--outline);
      color: var(--on-surface);
      background-color: var(--surface-tint-gold);
    }

    .prep-check-btn[aria-pressed="true"] {
      border-color: var(--positive);
      background-color: var(--surface-tint-positive);
      color: var(--positive);
    }

    .prep-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .prep-list li {
      position: relative;
      padding-right: var(--space-md);
      color: var(--on-surface-variant);
      font-size: 0.95rem;
    }

    .prep-list li::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0.68em;
      width: 6px;
      height: 6px;
      background-color: var(--primary);
    }

    .prep-list li strong {
      color: var(--on-surface);
      font-weight: 600;
    }

    .prep-formats {
      margin-top: auto;
      padding-top: var(--space-sm);
      border-top: var(--bronze-rule);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
    }

    .format-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px var(--space-sm);
      border: var(--bronze-rule);
      font-family: var(--font-label);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--tertiary);
      background-color: var(--background);
    }

    /* Explicit Visual-Only Disclaimer Callout */
    .policy-callout {
      border: 1px solid var(--warning);
      border-right: 4px solid var(--warning);
      background-color: var(--surface-tint-warning);
      padding: var(--space-lg);
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
    }

    .policy-icon {
      flex-shrink: 0;
      color: var(--warning);
      margin-top: 2px;
    }

    .policy-body {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .policy-title {
      margin: 0;
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--subhead-size);
      color: var(--warning);
    }

    .policy-text {
      margin: 0;
      color: var(--on-surface);
      max-width: 72ch;
    }

    /* Section 2: Order Form Shell (Tool Layout: Inputs + Live Output) */
    .order-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr);
      gap: var(--space-lg);
      align-items: start;
    }

    .form-frame {
      border: var(--gold-rule);
      outline: var(--gold-rule);
      outline-offset: calc(-1 * var(--gold-frame-inset));
      background-color: var(--surface-container-low);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .form-group-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      padding-bottom: var(--space-lg);
      border-bottom: var(--bronze-rule);
    }

    .form-group-block:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .group-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .group-title {
      margin: 0;
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--subhead-size);
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .group-step {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 2px var(--space-sm);
      border: var(--gold-rule);
      color: var(--primary);
    }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md);
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .field--full {
      grid-column: 1 / -1;
    }

    .field-label {
      font-family: var(--font-label);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--on-surface);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .req-mark {
      color: var(--primary);
      font-weight: 700;
    }

    .opt-mark {
      color: var(--on-surface-variant);
      font-size: 0.78rem;
      font-weight: 400;
    }

    .field-input,
    .field-select,
    .field-textarea {
      width: 100%;
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--background);
      border: var(--bronze-rule);
      border-bottom: var(--gold-rule);
      color: var(--on-surface);
      font-size: 0.95rem;
      transition: border-color var(--dur-short) var(--ease-out),
                  background-color var(--dur-short) var(--ease-out);
    }

    .field-select {
      padding-left: var(--space-xl);
      cursor: pointer;
    }

    .field-textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.55;
    }

    .field-input::placeholder,
    .field-textarea::placeholder {
      color: var(--on-surface-variant);
      opacity: 0.58;
    }

    .field-input:hover,
    .field-select:hover,
    .field-textarea:hover {
      border-color: var(--outline);
    }

    .field-input:focus,
    .field-select:focus,
    .field-textarea:focus {
      background-color: var(--surface-container);
      border-color: var(--tertiary);
    }

    .field.has-error .field-input,
    .field.has-error .field-select,
    .field.has-error .field-textarea {
      border-color: var(--error);
      background-color: var(--surface-tint-error);
    }

    .field-error {
      font-size: 0.82rem;
      color: var(--error);
      min-height: 1.2em;
      display: none;
    }

    .field.has-error .field-error {
      display: block;
    }

    /* Package Radio Cards */
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    .pkg-option {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      padding: var(--space-md);
      min-height: 44px;
      border: var(--bronze-rule);
      background-color: var(--background);
      cursor: pointer;
      transition: background-color var(--dur-short) var(--ease-out),
                  border-color var(--dur-short) var(--ease-out);
    }

    .pkg-option:hover {
      border-color: var(--outline);
      background-color: var(--surface-tint-gold);
    }

    .pkg-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .pkg-option.is-selected {
      border-color: var(--outline);
      background-color: var(--primary-container);
      box-shadow: inset 0 0 0 1px
